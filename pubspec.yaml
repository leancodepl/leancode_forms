  flutter: ">=3.19.0"

dependencies:
  collection: ^1.17.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  meta: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^15.0.0
