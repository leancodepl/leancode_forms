version: 0.2.0
homepage: https://github.com/leancodepl/advanced_forms
repository: https://github.com/leancodepl/advanced_forms
issue_tracker: https://github.com/leancodepl/advanced_forms/issues
topics:
  - forms
  - validation
  - state-management
  - ui
  - widgets

environment:
